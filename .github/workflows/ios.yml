name: Compilation iOS (sans signature)

# Verifie que l'app compile pour iPhone sur un Mac heberge par GitHub.
# Aucun compte Apple Developer n'est necessaire pour cette etape.
# Declenchement manuel : onglet Actions > "Compilation iOS" > Run workflow.
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compiler iOS (sans signature)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE=https://api-416-records.onrender.com/api/
      - name: Archiver le resultat
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr 416-records-ios-nonsigne.zip Payload
      - uses: actions/upload-artifact@v4
        with:
          name: 416-records-ios-nonsigne
          path: 416-records-ios-nonsigne.zip
          retention-days: 7
