name: records416
description: "416 Records — application native du label et du concours."
publish_to: "none"
version: 1.0.23+25

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  http: ^1.2.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  video_player: 2.9.1
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.4+4
  unity_levelplay_mediation: 9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Mono416
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
